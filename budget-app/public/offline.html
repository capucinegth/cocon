<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8fa" />
    <title>Hors connexion · Cocon</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
        background: #fff8fa; color: #3d3438;
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        width: 100%; max-width: 26rem; text-align: center; background: #fff; border-radius: 28px;
        padding: 40px 24px; box-shadow: 0 1px 2px rgba(61, 52, 56, 0.04), 0 8px 24px rgba(61, 52, 56, 0.06);
      }
      .mark { width: 56px; height: 56px; margin: 0 auto 20px; }
      h1 { font-size: 22px; line-height: 1.25; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { margin: 0; color: #74666b; font-size: 15px; line-height: 1.5; }
      button {
        margin-top: 24px; height: 48px; padding: 0 24px; border: 0; border-radius: 999px;
        background: #3d3438; color: #fff; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #9a4d65; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8a7b8" /><stop offset="1" stop-color="#dcd5f2" /></linearGradient></defs>
        <rect width="40" height="40" rx="13" fill="url(#g)" />
        <path d="M25.66 14.34A8 8 0 1 0 25.66 25.66" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" />
        <circle cx="20" cy="20" r="2.4" fill="#fff" />
      </svg>
      <h1>Tu es hors connexion</h1>
      <p>Cocon a besoin d'Internet pour afficher et enregistrer ton budget. Tes données sont en sécurité : rien n'est perdu.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
